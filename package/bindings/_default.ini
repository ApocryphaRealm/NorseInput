; NorseInput default bindings (2026-11-17). Gamepad controls are NorseRealtimeNative 0.5.x's own (moved out of its code
; unchanged); keyboard and mouse controls are new - the attacks had none before.
; Gestures: :hold (held 0.35 s), :double (two taps within 0.3 s); without one, a control fires on press and release.

[NorseRealtimeNative]
LightAttack = Pad.RB, Mouse.Left        ; an archer: draw while held, loose on release
PowerAttack = Pad.RT, Key.F             ; an archer: the power shot
LockOn = Pad.R3, Key.Q
BowCancel = Pad.X, Key.X                ; an archer with the bow drawn: lower it
